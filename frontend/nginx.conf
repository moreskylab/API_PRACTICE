server {
    listen 8888;
    server_name localhost;

    # Serve the static Vite build assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Python backend to bypass CORS
    location /objects {
        # Replace 'backend-container-name' with your actual backend container network alias or IP
        proxy_pass http://backend-py:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
