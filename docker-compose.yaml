services:
  backend-dotnet:
    build:
      context: ./backend-dotnet
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    ports:
      - "8081:8081"

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    ports:
      - "8082:8080"

  backend-py:
    build:
      context: ./backend-py
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend-py
    ports:
      - "8888:8888"