services:
  backend-dotnet:
    build:
      context: ./backend-dotnet
    ports:
      - "8080:8080"

  backend-go:
    build:
      context: ./backend-go
    ports:
      - "8081:8081"

  backend-java:
    build:
      context: ./backend-java
    ports:
      - "8082:8080"

  backend-py:
    build:
      context: ./backend-py
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend-py
    ports:
      - "8888:8888"